    <script language="JavaScript">
        function agregar() {
            var url = "https://thenweb.github.io/radiomegaonline";
            var titulo = "Radio Cristiana Omega";
            if (window.sidebar) {
                // Mozilla Firefox Bookmark
                window.sidebar.addPanel(titulo, url, "");
            } else if (window.external) { // IE Favorite
                if (window.ActiveXObject) {
                    //ie
                    window.external.AddFavorite(url, titulo);
                } else { //chrome
                    alert('Presiona Crtl+D para Agregar a Marcadores');
                }
            } else if (window.opera && window.print) { // Opera
                return true;
            } else { //safri
                alert('Presiona Crtl+D para Agregar a Marcadores');
            }
        }

    </script>

    <!----CSS: Estilos de la Pantalla de Carga ---->
    <style>
        /* Capa superior que cubre todo */
        #pantalla-bienvenida {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100000;
            /* Siempre por encima de todo */
            transition: opacity 1.5s ease-in-out;
            /* Desaparición lenta */
        }

        /* Logo Responsive */
        #logo-bienvenida {
            width: 40%;
            max-width: 250px;
            height: auto;
            opacity: 0;
            /* Inicia invisible */
            transform: scale(0.9);
            transition: opacity 2.5s ease, transform 2.5s ease;
            /* Aparición lenta */
        }

        /* Texto Bienvenido */
        #texto-bienvenida {
            color: #d6d6d6;
            font-family: sans-serif;
            margin-top: 20px;
            font-size: 1.5rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 2.5s ease 0.5s;
            /* Aparece después del logo */
        }

        /* Clase para activar la aparición */
        .mostrar {
            opacity: 1 !important;
            transform: scale(1) !important;
        }

        /* Tu etiqueta main actual (Se asume que ya existe en tu web) */
        main {
            opacity: 0;
            /* Invisible hasta que termine el splash */
            transition: opacity 2s ease;
        }

    </style>

<!---- Boton Compartir---->
    
   <script>
document.getElementById('btnCompartir').addEventListener('click', async () => {
    // 1. Definimos los datos de tu radio
    const titulo = 'Radio Cristiana Omega';
    const descripcion = 'Anunciando los tiempos del fin, según la Bíblia';
    const enlaceWeb = 'https://thenweb.github.io/radiomegaonline/';

    // 2. Creamos el bloque unificado de texto
    const mensajeTexto = `*${titulo}*\n${descripcion}\n\n${enlaceWeb}`;

    // 3. Compartimos mediante la API nativa o el fallback de WhatsApp
    if (navigator.share) {
        try {
            await navigator.share({
                title: titulo,
                text: mensajeTexto
            });
        } catch (error) {
            console.error('Error al compartir:', error);
        }
    } else {
        // Respaldo para computadoras de escritorio o navegadores antiguos
        const urlWhatsApp = `https://whatsapp.com{encodeURIComponent(mensajeTexto)}`;
        window.open(urlWhatsApp, '_blank');
    }
});

</script>

    <script>
        // pantalla-bienvenida
        document.addEventListener('DOMContentLoaded', () => {
            const splash = document.getElementById('pantalla-bienvenida');
            const logo = document.getElementById('logo-bienvenida');
            const texto = document.getElementById('texto-bienvenida');
            const mainContenido = document.querySelector('main');

            // 1. Hace aparecer el logo y el texto
            setTimeout(() => {
                logo.classList.add('mostrar');
                texto.classList.add('mostrar');
            }, 300);

            // 2. Inicia la desaparición total tras 4.5 segundos
            setTimeout(() => {
                splash.style.opacity = '0';

                // Muestra tu contenido principal suavemente
                if (mainContenido) mainContenido.style.opacity = '1';

                // 3. Elimina el splash y habilita el scroll
                setTimeout(() => {
                    splash.style.display = 'none';
                    document.body.style.overflow = 'auto';
                }, 1500); // Tiempo de la transición de salida

            }, 4500);
        });

    </script>
